name: CI

# Tests run on PRs only (never re-run on merge: the pull_request check already
# tested the merge preview), on both OSes nexus targets, BEFORE publish.yml can
# ship a version. The unit suite mocks spawn; the e2e suite drives the real
# binary against fake tools; the docker job proves a bare machine (no python).
#
# Release PRs only bump package.json/package-lock.json — the code they ship was
# already tested in its feature PR, so the matrix work is skipped for them.
# Two constraints shape HOW:
#   - `on.paths-ignore` would leave the ruleset's required checks "Expected"
#     forever (workflow never triggers) and block every release merge.
#   - a job-level `if` on a matrix job skips BEFORE matrix expansion, so the
#     check reports as the literal "unit (${{ matrix.os }})" — which is not the
#     context name the ruleset requires, and the merge stays blocked.
# Hence: the `changes` gate always runs, and every STEP self-skips — the jobs
# expand, spin a runner for a few seconds, and report success under their real
# names. Trade-off: a pure dependency-bump PR skips the matrix too; publish.yml
# still runs `npm ci` + the prepare build as a net before anything reaches npm.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: changes (release bump?)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Detect non-bump changes
        id: filter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          echo "changed files:"; echo "$FILES"
          if echo "$FILES" | grep -qvE '^(package\.json|package-lock\.json)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "version bump only -> test matrix skipped"
          fi

  unit:
    name: unit (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: npm run build
      - if: needs.changes.outputs.code == 'true'
        run: npm test

  e2e:
    name: e2e (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: npm run test:e2e

  fresh-user:
    name: fresh-user (bare node, no python)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      # The e2e suite runs inside a node:22-slim stage with no python/pip/claude/
      # litellm — a build failure here means the CLI assumed dev tooling exists.
      - if: needs.changes.outputs.code == 'true'
        run: docker build -f test/docker/Dockerfile .
