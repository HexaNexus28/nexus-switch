name: CI

# Tests run on PRs only (never re-run on merge: the pull_request check already
# tested the merge preview), on both OSes nexus targets, BEFORE publish.yml can
# ship a version. The unit suite mocks spawn; the e2e suite drives the real
# binary against fake tools; the docker job proves a bare machine (no python).
#
# paths-ignore: a release PR only bumps package.json/package-lock.json — the
# code it ships was already tested in its feature PR, so re-running the full
# matrix is redundant. Trade-off: a pure dependency-bump PR skips CI too;
# publish.yml still runs `npm ci` + the prepare build, which catches a broken
# install before anything reaches npm.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:e2e

  fresh-user:
    name: fresh-user (bare node, no python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The e2e suite runs inside a node:22-slim stage with no python/pip/claude/
      # litellm — a build failure here means the CLI assumed dev tooling exists.
      - run: docker build -f test/docker/Dockerfile .
